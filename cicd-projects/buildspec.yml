version: 0.2

phases:

  pre_build:
    commands:
      - echo "Logging in to Docker Hub..."
      - echo $/Myapp/DOCKER_PASSWORD | docker login -u $/Myapp/DOCKER_USERNAME --password-stdin

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t cicd-project .

      - echo "Tagging Docker image..."
      - docker tag cicd-project iamprathap/cicd-project:latest

  post_build:
    commands:
      - echo "Pushing Docker image to Docker Hub..."
      - docker push iamprathap/cicd-project:latest

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
